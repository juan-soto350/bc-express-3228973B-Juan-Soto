services:
  mongo:
    image: mongo:7
    container_name: bootcamp_mongo_arcade
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: bootcamp
      MONGO_INITDB_ROOT_PASSWORD: bootcamp123
      MONGO_INITDB_DATABASE: bootcamp_arcade_dev
    ports:
      - "27017:27017"
    volumes:
      - mongo_arcade_data:/data/db

volumes:
  mongo_arcade_data:
